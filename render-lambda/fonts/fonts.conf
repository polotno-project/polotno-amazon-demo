<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Lambda has no system fonts. Without this file, any design that asks for Arial
  or Times New Roman renders as empty boxes, or polotno-node fails with
  "Timeout for loading font <name>".

  Two directories are listed, and both are needed:

    /var/task/fonts  the Liberation fonts next to this file, metric-compatible
                     replacements for Arial and Times New Roman.

    /tmp/fonts       the font set that @sparticuz/chromium unpacks on cold
                     start. It normally finds this on its own, because it does
                     `process.env.FONTCONFIG_PATH ??= '/tmp/fonts'`. The moment
                     the Lambda sets FONTCONFIG_PATH itself, that assignment
                     does nothing and this file becomes the only configuration
                     fontconfig reads. Leaving /tmp/fonts out here would
                     silently throw away Chromium's own fonts.

  Google Fonts used in a design are a separate matter. polotno-node loads those
  over the network at render time and caches them in /tmp.
-->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <dir>/tmp/fonts</dir>

  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
